syntax = "proto3";

package logoschat.inbox;

import "invite.proto";

message Note{
    string text = 1;
}

message InboxV1Frame {
    oneof frame_type {
        invite.InvitePrivateV1 invite_private_v1 = 1;
    }
}

message InboxV2Frame {
    oneof payload {
        invite.GroupV1HeavyInvite group_v1 = 1;
        bytes group_v2 = 2;
    }
}
